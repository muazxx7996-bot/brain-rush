<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Rush</title>

<style>
:root{
  --bg:#090d18;
  --panel:#12192a;
  --panel2:#182238;
  --border:#2a3858;
  --text:#ffffff;
  --muted:#93a0bd;
  --cyan:#27d7ff;
  --blue:#568cff;
  --green:#39df88;
  --red:#ff6075;
  --yellow:#ffd54a;
  --purple:#a98cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(86,140,255,.14),transparent 30%),
    radial-gradient(circle at 90% 5%,rgba(39,215,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
}

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  border-bottom:1px solid var(--border);
  background:rgba(9,13,24,.92);
  backdrop-filter:blur(14px);
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{color:var(--cyan)}

.topstats{
  display:flex;
  gap:28px;
}

.stat{
  text-align:center;
  font-size:11px;
  color:var(--muted);
}

.stat b{
  display:block;
  color:white;
  font-size:19px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:38px 24px 70px;
}

.main-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.round-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.round-label{
  color:var(--cyan);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.4px;
}

.progress{
  height:8px;
  background:#22304a;
  border-radius:20px;
  overflow:hidden;
  margin-top:16px;
}

.progress div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transition:.3s;
}

.game-area{
  position:relative;
  overflow:hidden;
  margin-top:22px;
  min-height:440px;
  border:1px solid var(--border);
  border-radius:16px;
  background:#0c1425;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.center{
  text-align:center;
}

.big{
  font-size:58px;
  font-weight:900;
}

.muted{color:var(--muted)}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#03101d;
}

.secondary{
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
}

.danger{
  background:var(--red);
  color:white;
}

.intro-overlay{
  position:absolute;
  inset:0;
  z-index:10;
  background:
    radial-gradient(circle at center,rgba(86,140,255,.12),transparent 42%),
    #0a1222;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
  text-align:center;
}

.intro-title{
  font-size:40px;
  font-weight:900;
  margin:10px 0;
}

.intro-text{
  max-width:590px;
  color:var(--muted);
  font-size:17px;
  line-height:1.7;
}

.press{
  margin-top:25px;
  color:var(--cyan);
  font-weight:900;
  letter-spacing:1.5px;
}

.feedback{
  position:absolute;
  inset:0;
  z-index:12;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(6,12,22,.92);
  text-align:center;
}

.feedback.show{display:flex}

.number-grid,
.answer-grid{
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.answer{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:22px;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
}

.answer:hover{
  border-color:var(--cyan);
  transform:translateY(-2px);
}

.input-box{
  width:100%;
  max-width:430px;
  background:#0f1a2e;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  outline:none;
  text-align:center;
  font-size:20px;
}

.sequence{
  font-size:44px;
  font-weight:900;
  letter-spacing:8px;
}

.memory-grid{
  display:grid;
  grid-template-columns:repeat(4,80px);
  gap:10px;
}

.memory-cell{
  width:80px;
  height:80px;
  border-radius:10px;
  background:#263654;
  border:1px solid #39527f;
  cursor:pointer;
}

.memory-cell.active{
  background:var(--yellow);
  box-shadow:0 0 26px rgba(255,213,74,.42);
}

.memory-cell.selected{
  outline:3px solid var(--cyan);
}

.stroop-word{
  font-size:72px;
  font-weight:900;
  letter-spacing:2px;
}

.logic-box{
  max-width:600px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:28px;
}

.logic-line{
  font-size:28px;
  margin:10px 0;
}

.attention-grid{
  display:grid;
  grid-template-columns:repeat(6,48px);
  gap:9px;
}

.attention-cell{
  width:48px;
  height:48px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:#17233b;
  border:1px solid #2a3a5d;
}

.reverse-display{
  font-size:46px;
  font-weight:900;
  letter-spacing:10px;
}

.final{
  display:none;
  text-align:center;
  padding:25px;
}

.final.show{display:block}

.final-score{
  font-size:84px;
  font-weight:900;
  color:var(--cyan);
}

.grade{
  font-size:28px;
  font-weight:900;
  color:var(--green);
}

.final-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin:25px 0;
}

.skill{
  background:#131f35;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}

.skill b{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.skillbar{
  height:7px;
  background:#24314d;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.skillbar div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}

@media(max-width:800px){
  .final-grid{grid-template-columns:1fr 1fr}
  .memory-grid{grid-template-columns:repeat(4,65px)}
  .memory-cell{width:65px;height:65px}
  .attention-grid{grid-template-columns:repeat(5,44px)}
  .attention-cell{width:44px;height:44px}
}
</style>
</head>

<body>

<header>

<div class="logo">
<span>◆</span> Brain Rush
</div>

<div class="topstats">

<div class="stat">
<b id="roundDisplay">0/10</b>
ROUND
</div>

<div class="stat">
<b id="scoreDisplay">0</b>
SCORE
</div>

<div class="stat">
<b id="streakDisplay">0</b>
STREAK
</div>

</div>

</header>

<div class="container">

<div class="main-card">

<div class="round-top">

<div>
<div class="round-label">BRAIN TRAINING SESSION</div>
<h2 id="gameTitle">Ready?</h2>
</div>

<div class="muted" id="gameType">
10 cognitive rounds
</div>

</div>

<div class="progress">
<div id="roundProgress"></div>
</div>

<div class="game-area" id="gameArea">

<div class="center">

<div class="big">🧠</div>

<h2>Brain Rush</h2>

<p class="muted">
10 rounds testing memory, logic, attention, math and processing speed.
</p>

<button class="primary" onclick="startSession()">
START SESSION
</button>

</div>

</div>

<div class="final" id="finalScreen">

<div class="muted">BRAIN REPORT</div>

<div class="final-score" id="finalScore">0</div>

<div class="grade" id="finalGrade"></div>

<div class="final-grid">

<div class="skill">
Memory
<b id="memoryScore">0</b>
<div class="skillbar"><div id="memoryBar"></div></div>
</div>

<div class="skill">
Logic
<b id="logicScore">0</b>
<div class="skillbar"><div id="logicBar"></div></div>
</div>

<div class="skill">
Attention
<b id="attentionScore">0</b>
<div class="skillbar"><div id="attentionBar"></div></div>
</div>

<div class="skill">
Math
<b id="mathScore">0</b>
<div class="skillbar"><div id="mathBar"></div></div>
</div>

<div class="skill">
Speed
<b id="speedScore">0</b>
<div class="skillbar"><div id="speedBar"></div></div>
</div>

</div>

<p id="summaryText" class="muted"></p>

<button class="primary" onclick="startSession()">
PLAY AGAIN
</button>

</div>

</div>

</div>

<script>

const TOTAL_ROUNDS=10;

const gamePool=[
  "sequenceMemory",
  "stroop",
  "missingNumber",
  "visualMemory",
  "logic",
  "mentalMath",
  "reverseMemory",
  "attention",
  "oddPattern",
  "processingSpeed"
];

let round=0;
let totalScore=0;
let streak=0;
let bestStreak=0;
let sessionGames=[];

let active=false;
let currentGame=null;
let introListener=null;

let skillScores={
  memory:{earned:0,max:0},
  logic:{earned:0,max:0},
  attention:{earned:0,max:0},
  math:{earned:0,max:0},
  speed:{earned:0,max:0}
};

let memorySequence=[];
let visualTargets=[];
let selectedCells=[];
let reverseValue="";
let correctAnswer=null;
let timerStart=0;


function startSession(){

cleanup();

round=0;
totalScore=0;
streak=0;
bestStreak=0;

skillScores={
  memory:{earned:0,max:0},
  logic:{earned:0,max:0},
  attention:{earned:0,max:0},
  math:{earned:0,max:0},
  speed:{earned:0,max:0}
};

sessionGames=shuffle([...gamePool]).slice(0,TOTAL_ROUNDS);

document.getElementById("finalScreen").classList.remove("show");
document.getElementById("gameArea").style.display="flex";

updateTop();

setTimeout(nextRound,300);

}


function shuffle(arr){

for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
}

return arr;

}


function nextRound(){

cleanup();

if(round>=TOTAL_ROUNDS){
  endSession();
  return;
}

currentGame=sessionGames[round];

round++;

updateTop();

showIntro(currentGame);

}


function updateTop(){

document.getElementById("roundDisplay").innerText=
round+"/"+TOTAL_ROUNDS;

document.getElementById("scoreDisplay").innerText=
totalScore;

document.getElementById("streakDisplay").innerText=
streak;

document.getElementById("roundProgress").style.width=
(round/TOTAL_ROUNDS*100)+"%";

}


function gameInfo(game){

const info={

sequenceMemory:{
  title:"Sequence Memory",
  skill:"Memory",
  text:"A sequence of digits will appear briefly. Remember it and type it exactly in the same order."
},

stroop:{
  title:"Stroop Challenge",
  skill:"Attention",
  text:"A color word will appear in a different ink color. Ignore the word itself and choose the actual ink color."
},

missingNumber:{
  title:"Pattern Logic",
  skill:"Logic",
  text:"Study the number sequence and choose the number that logically comes next."
},

visualMemory:{
  title:"Visual Memory",
  skill:"Memory",
  text:"Several squares will light up. Remember their locations and select the same squares after they disappear."
},

logic:{
  title:"Logic Comparison",
  skill:"Logic",
  text:"Read the relationships carefully, then decide whether the final statement is true or false."
},

mentalMath:{
  title:"Mental Math",
  skill:"Math",
  text:"Solve the calculation mentally and choose the correct answer."
},

reverseMemory:{
  title:"Reverse Memory",
  skill:"Memory",
  text:"Remember the digit sequence, then enter the same sequence backwards."
},

attention:{
  title:"Selective Attention",
  skill:"Attention",
  text:"Count only the target symbol among many distractors. Do not count the other symbols."
},

oddPattern:{
  title:"Odd Pattern",
  skill:"Logic",
  text:"Choose the item that does not follow the same pattern as the others."
},

processingSpeed:{
  title:"Processing Speed",
  skill:"Speed",
  text:"Answer a very simple comparison as quickly as possible. Faster correct answers earn more points."
}

};

return info[game];

}


function showIntro(game){

active=false;

const info=gameInfo(game);

document.getElementById("gameTitle").innerText=
"Round "+round;

document.getElementById("gameType").innerText=
info.skill;

document.getElementById("gameArea").innerHTML=`

<div class="intro-overlay">

<div>

<div class="round-label">
ROUND ${round} • ${info.skill.toUpperCase()}
</div>

<div class="intro-title">
${info.title}
</div>

<div class="intro-text">
${info.text}
</div>

<div class="press">
PRESS ENTER TO BEGIN
</div>

<br>

<button class="secondary" onclick="beginCurrentRound()">
START ROUND
</button>

</div>

</div>
`;

introListener=(e)=>{

if(e.key==="Enter"){
  e.preventDefault();
  beginCurrentRound();
}

};

document.addEventListener("keydown",introListener);

}


function beginCurrentRound(){

if(introListener){
  document.removeEventListener("keydown",introListener);
  introListener=null;
}

launchGame(currentGame);

}


function launchGame(game){

if(game==="sequenceMemory") startSequenceMemory();
if(game==="stroop") startStroop();
if(game==="missingNumber") startMissingNumber();
if(game==="visualMemory") startVisualMemory();
if(game==="logic") startLogic();
if(game==="mentalMath") startMentalMath();
if(game==="reverseMemory") startReverseMemory();
if(game==="attention") startAttention();
if(game==="oddPattern") startOddPattern();
if(game==="processingSpeed") startProcessingSpeed();

}


function winRound(points,skill,message){

if(!active) return;

active=false;

totalScore+=points;
streak++;
bestStreak=Math.max(bestStreak,streak);

skillScores[skill].earned+=points;
skillScores[skill].max+=150;

updateTop();

showFeedback(true,message,"+"+points+" points");

}


function failRound(skill,message){

if(!active) return;

active=false;
streak=0;

skillScores[skill].max+=150;

updateTop();

showFeedback(false,message,"No points");

}


function showFeedback(success,title,sub){

document.getElementById("gameArea").innerHTML=`

<div class="feedback show">

<div>

<div class="big">
${success ? "✓" : "✕"}
</div>

<h2 style="color:${success ? "#39df88" : "#ff6075"}">
${title}
</h2>

<p class="muted">
${sub}
</p>

</div>

</div>
`;

setTimeout(nextRound,1400);

}


/* =========================
SEQUENCE MEMORY
========================= */

function startSequenceMemory(){

document.getElementById("gameTitle").innerText="Sequence Memory";

const len=5+Math.floor(Math.random()*2);

memorySequence=[];

for(let i=0;i<len;i++){
  memorySequence.push(Math.floor(Math.random()*10));
}

active=false;

document.getElementById("gameArea").innerHTML=`

<div class="center">

<div class="sequence">
${memorySequence.join(" ")}
</div>

<p class="muted">
Remember the sequence.
</p>

</div>
`;

setTimeout(()=>{

active=true;

document.getElementById("gameArea").innerHTML=`

<div class="center">

<h2>Type the sequence</h2>

<input
id="memoryInput"
class="input-box"
placeholder="Enter digits"
autocomplete="off">

</div>
`;

const input=document.getElementById("memoryInput");

input.focus();

input.onkeydown=(e)=>{

if(e.key==="Enter"){

const answer=input.value.replace(/\s/g,"");

const correct=memorySequence.join("");

if(answer===correct){
  winRound(130,"memory","Perfect memory");
}else{
  failRound("memory","Correct sequence: "+correct);
}

}

};

},2200);

}


/* =========================
STROOP
========================= */

function startStroop(){

document.getElementById("gameTitle").innerText="Stroop Challenge";

const colors=[
{name:"RED",value:"#ff6075"},
{name:"BLUE",value:"#568cff"},
{name:"GREEN",value:"#39df88"},
{name:"YELLOW",value:"#ffd54a"}
];

const word=
colors[Math.floor(Math.random()*colors.length)];

let ink=
colors[Math.floor(Math.random()*colors.length)];

while(ink.name===word.name){
  ink=colors[Math.floor(Math.random()*colors.length)];
}

correctAnswer=ink.name;

active=true;

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<div
class="stroop-word"
style="color:${ink.value}">
${word.name}
</div>

<p class="muted">
Choose the INK COLOR.
</p>

<div class="answer-grid" style="margin:auto">

${shuffle(colors.map(c=>c.name)).map(name=>`
<div class="answer" onclick="stroopAnswer('${name}')">
${name}
</div>
`).join("")}

</div>

</div>
`;

}


function stroopAnswer(value){

if(!active) return;

if(value===correctAnswer){
  winRound(120,"attention","Correct focus");
}else{
  failRound("attention","Ink color was "+correctAnswer);
}

}


/* =========================
MISSING NUMBER
========================= */

function startMissingNumber(){

document.getElementById("gameTitle").innerText="Pattern Logic";

active=true;

const type=Math.floor(Math.random()*3);

let seq=[];
let next;

if(type===0){

let start=Math.floor(Math.random()*4)+2;
let step=Math.floor(Math.random()*4)+2;

seq=[
start,
start+step,
start+step*2,
start+step*3
];

next=start+step*4;

}else if(type===1){

let start=Math.floor(Math.random()*3)+2;

seq=[
start,
start*2,
start*4,
start*8
];

next=start*16;

}else{

let start=Math.floor(Math.random()*4)+1;

seq=[
start,
start+2,
start+6,
start+12
];

next=start+20;

}

correctAnswer=next;

let answers=[
next,
next+2,
next-2,
next+4
];

answers=shuffle([...new Set(answers)]);

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<div class="sequence">
${seq.join("   ")}   ?
</div>

<br><br>

<div class="answer-grid" style="margin:auto">

${answers.map(x=>`
<div class="answer" onclick="missingAnswer(${x})">
${x}
</div>
`).join("")}

</div>

</div>
`;

}


function missingAnswer(value){

if(value===correctAnswer){
  winRound(125,"logic","Pattern solved");
}else{
  failRound("logic","Answer was "+correctAnswer);
}

}


/* =========================
VISUAL MEMORY
========================= */

function startVisualMemory(){

document.getElementById("gameTitle").innerText="Visual Memory";

visualTargets=[];
selectedCells=[];
active=false;

while(visualTargets.length<5){

let n=Math.floor(Math.random()*16);

if(!visualTargets.includes(n)){
  visualTargets.push(n);
}

}

let html=`<div class="memory-grid">`;

for(let i=0;i<16;i++){

html+=`
<div
class="memory-cell ${visualTargets.includes(i) ? "active":""}"
id="vm${i}">
</div>
`;

}

html+="</div>";

document.getElementById("gameArea").innerHTML=html;

setTimeout(()=>{

active=true;

let html2=`<div class="memory-grid">`;

for(let i=0;i<16;i++){

html2+=`
<div
class="memory-cell"
id="vm${i}"
onclick="selectVisual(${i})">
</div>
`;

}

html2+="</div>";

document.getElementById("gameArea").innerHTML=html2;

},1800);

}


function selectVisual(i){

if(!active) return;

if(selectedCells.includes(i)) return;

selectedCells.push(i);

document.getElementById("vm"+i).classList.add("selected");

if(selectedCells.length===5){

const correct=
selectedCells.every(x=>visualTargets.includes(x));

if(correct){
  winRound(150,"memory","Visual memory complete");
}else{
  failRound("memory","Some positions were incorrect");
}

}

}


/* =========================
LOGIC
========================= */

function startLogic(){

document.getElementById("gameTitle").innerText="Logic Comparison";

active=true;

const names=["A","B","C"];

const valid=Math.random()>.5;

let finalText;

if(valid){
  finalText="A is greater than C.";
  correctAnswer="TRUE";
}else{
  finalText="C is greater than A.";
  correctAnswer="FALSE";
}

document.getElementById("gameArea").innerHTML=`

<div class="center">

<div class="logic-box">

<div class="logic-line">
A > B
</div>

<div class="logic-line">
B > C
</div>

<hr style="border-color:#2a3858">

<h2>
${finalText}
</h2>

<br>

<div class="row" style="justify-content:center">

<button class="primary" onclick="logicAnswer('TRUE')">
TRUE
</button>

<button class="danger" onclick="logicAnswer('FALSE')">
FALSE
</button>

</div>

</div>

</div>
`;

}


function logicAnswer(value){

if(value===correctAnswer){
  winRound(120,"logic","Logical deduction correct");
}else{
  failRound("logic","Incorrect deduction");
}

}


/* =========================
MENTAL MATH
========================= */

function startMentalMath(){

document.getElementById("gameTitle").innerText="Mental Math";

active=true;

let a=Math.floor(Math.random()*20)+5;
let b=Math.floor(Math.random()*12)+2;
let c=Math.floor(Math.random()*8)+2;

correctAnswer=(a*b)-c;

let answers=[
correctAnswer,
correctAnswer+4,
correctAnswer-3,
correctAnswer+7
];

answers=shuffle([...new Set(answers)]);

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<div class="big">
${a} × ${b} − ${c}
</div>

<br>

<div class="answer-grid" style="margin:auto">

${answers.map(x=>`
<div class="answer" onclick="mathAnswer(${x})">
${x}
</div>
`).join("")}

</div>

</div>
`;

}


function mathAnswer(value){

if(value===correctAnswer){
  winRound(125,"math","Correct calculation");
}else{
  failRound("math","Answer was "+correctAnswer);
}

}


/* =========================
REVERSE MEMORY
========================= */

function startReverseMemory(){

document.getElementById("gameTitle").innerText="Reverse Memory";

let arr=[];

for(let i=0;i<5;i++){
  arr.push(Math.floor(Math.random()*10));
}

reverseValue=
arr.slice().reverse().join("");

active=false;

document.getElementById("gameArea").innerHTML=`

<div class="center">

<div class="reverse-display">
${arr.join(" ")}
</div>

<p class="muted">
Remember it. You will type it backwards.
</p>

</div>
`;

setTimeout(()=>{

active=true;

document.getElementById("gameArea").innerHTML=`

<div class="center">

<h2>Type it backwards</h2>

<input
id="reverseInput"
class="input-box"
placeholder="Reverse sequence"
autocomplete="off">

</div>
`;

const input=document.getElementById("reverseInput");

input.focus();

input.onkeydown=(e)=>{

if(e.key==="Enter"){

const value=input.value.replace(/\s/g,"");

if(value===reverseValue){
  winRound(145,"memory","Reverse memory correct");
}else{
  failRound("memory","Correct answer: "+reverseValue);
}

}

};

},2000);

}


/* =========================
SELECTIVE ATTENTION
========================= */

function startAttention(){

document.getElementById("gameTitle").innerText="Selective Attention";

active=true;

const symbols=["▲","●","■","◆"];

const target=
symbols[Math.floor(Math.random()*symbols.length)];

let items=[];
let count=0;

for(let i=0;i<30;i++){

const s=symbols[Math.floor(Math.random()*symbols.length)];

items.push(s);

if(s===target) count++;

}

correctAnswer=count;

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<h2>
Count only:
<span style="color:var(--yellow)">
${target}
</span>
</h2>

<div class="attention-grid" style="margin:20px auto">

${items.map(x=>`
<div class="attention-cell">
${x}
</div>
`).join("")}

</div>

<div class="answer-grid" style="margin:auto">

${shuffle([
count,
Math.max(0,count-1),
count+1,
count+2
]).map(x=>`
<div class="answer" onclick="attentionAnswer(${x})">
${x}
</div>
`).join("")}

</div>

</div>
`;

}


function attentionAnswer(value){

if(value===correctAnswer){
  winRound(135,"attention","Excellent attention");
}else{
  failRound("attention","Correct count: "+correctAnswer);
}

}


/* =========================
ODD PATTERN
========================= */

function startOddPattern(){

document.getElementById("gameTitle").innerText="Odd Pattern";

active=true;

const sets=[
  ["2","4","6","9"],
  ["▲","▲","▲","■"],
  ["AB","BC","CD","CF"],
  ["11","22","33","35"]
];

const set=
sets[Math.floor(Math.random()*sets.length)];

let oddIndex;

if(set[0]==="2") oddIndex=3;
else if(set[0]==="▲") oddIndex=3;
else if(set[0]==="AB") oddIndex=3;
else oddIndex=3;

correctAnswer=oddIndex;

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<h2>Which one does not belong?</h2>

<div class="answer-grid" style="margin:auto">

${set.map((x,i)=>`
<div class="answer" onclick="oddAnswer(${i})">
${x}
</div>
`).join("")}

</div>

</div>
`;

}


function oddAnswer(index){

if(index===correctAnswer){
  winRound(120,"logic","Odd pattern found");
}else{
  failRound("logic","Wrong choice");
}

}


/* =========================
PROCESSING SPEED
========================= */

function startProcessingSpeed(){

document.getElementById("gameTitle").innerText="Processing Speed";

active=true;

const a=Math.floor(Math.random()*90)+10;
const b=Math.floor(Math.random()*90)+10;

correctAnswer=
a>b ? "LEFT":"RIGHT";

timerStart=performance.now();

document.getElementById("gameArea").innerHTML=`

<div class="center" style="width:100%">

<h2>Which number is larger?</h2>

<div class="number-grid" style="margin:auto">

<div class="answer" onclick="speedAnswer('LEFT')">
${a}
</div>

<div class="answer" onclick="speedAnswer('RIGHT')">
${b}
</div>

</div>

</div>
`;

}


function speedAnswer(value){

if(!active) return;

const ms=
performance.now()-timerStart;

if(value===correctAnswer){

let points=
ms<800 ? 150 :
ms<1300 ? 130 :
ms<2000 ? 110 :
90;

winRound(points,"speed",Math.round(ms)+" ms");

}else{

failRound("speed","Incorrect comparison");

}

}


/* =========================
FINAL REPORT
========================= */

function skillPercent(skill){

const s=skillScores[skill];

if(!s.max) return 0;

return Math.round((s.earned/s.max)*100);

}


function endSession(){

cleanup();

document.getElementById("gameArea").style.display="none";

document.getElementById("finalScreen").classList.add("show");

const memory=skillPercent("memory");
const logic=skillPercent("logic");
const attention=skillPercent("attention");
const math=skillPercent("math");
const speed=skillPercent("speed");

const skills={
  Memory:memory,
  Logic:logic,
  Attention:attention,
  Math:math,
  Speed:speed
};

const overall=Math.round(
(memory+logic+attention+math+speed)/5
);

document.getElementById("finalScore").innerText=
overall+"/100";

document.getElementById("memoryScore").innerText=memory;
document.getElementById("logicScore").innerText=logic;
document.getElementById("attentionScore").innerText=attention;
document.getElementById("mathScore").innerText=math;
document.getElementById("speedScore").innerText=speed;

document.getElementById("memoryBar").style.width=memory+"%";
document.getElementById("logicBar").style.width=logic+"%";
document.getElementById("attentionBar").style.width=attention+"%";
document.getElementById("mathBar").style.width=math+"%";
document.getElementById("speedBar").style.width=speed+"%";

let grade;

if(overall>=90){
  grade="Exceptional 🧠🔥";
}else if(overall>=80){
  grade="Excellent";
}else if(overall>=70){
  grade="Very Good";
}else if(overall>=60){
  grade="Good";
}else{
  grade="Keep Training";
}

document.getElementById("finalGrade").innerText=grade;

const entries=Object.entries(skills);

entries.sort((a,b)=>b[1]-a[1]);

const strongest=entries[0][0];
const weakest=entries[entries.length-1][0];

document.getElementById("summaryText").innerText=
`Strongest skill: ${strongest}. Area to improve: ${weakest}.`;

}


function cleanup(){

if(introListener){
  document.removeEventListener("keydown",introListener);
  introListener=null;
}

active=false;

}


</script>
